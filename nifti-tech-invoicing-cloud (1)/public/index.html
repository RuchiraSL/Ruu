<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nifti Tech Invoicing</title>
<style>
:root{--paper:#f6f7f8;--card:#fff;--ink:#1b2430;--mute:#66707d;--line:#d9dee4;--acc:#0f6e8c;--ok:#2e7d4f;--warn:#a8741a;--bad:#b3412f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:28px;padding:0 24px;min-height:56px;flex-wrap:wrap}
header b{font-size:17px;letter-spacing:.2px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:#b9c3cf;font:inherit;padding:16px 12px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:#4fb3d1}
main{max-width:1000px;margin:24px auto;padding:0 16px}
h2{margin:0 0 16px;font-size:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.stat small{color:var(--mute);display:block}
.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.stat.big strong{color:var(--bad)}
.clk{display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.clk .tm{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.clk .tp{font-size:28px;font-weight:300;text-align:right;line-height:1.1}
.clk small{color:var(--mute);display:block}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:6px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute);font-weight:600;background:#fafbfc}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:#f0f6f9}
.wrap{overflow-x:auto}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dng{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.tag.draft{color:var(--mute);border-color:var(--line)}
.tag.sent{color:var(--acc);border-color:var(--acc)}
.tag.paid{color:var(--ok);border-color:var(--ok)}
.tag.overdue{color:var(--bad);border-color:var(--bad)}
.empty{padding:32px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:6px}
.tot{margin-left:auto;width:280px;max-width:100%}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.tot .g{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:700;font-size:17px}
.tag.partial{color:var(--warn);border-color:var(--warn)}.tag.approved,.tag.active{color:var(--ok);border-color:var(--ok)}.tag.rejected{color:var(--bad);border-color:var(--bad)}.tag.done{color:var(--mute);border-color:var(--line)}
.bar{height:8px;background:var(--acc);border-radius:2px;min-width:1px}.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.inl>div{flex:1;min-width:120px}a{color:var(--acc)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:6px;display:none}
#sheet{background:#fff;border:1px solid var(--line);padding:40px;margin-bottom:16px}
#sheet h1{margin:0;font-size:28px}
#sheet .top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
#sheet table{border:0;margin:16px 0}
#sheet .pre{white-space:pre-line}
.mute{color:var(--mute)}
@page{size:A4;margin:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#sheet{padding:48px 56px;letter-spacing:.3px}
#sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
#sheet .ttl{font-size:60px;font-weight:200;letter-spacing:2px;line-height:1;margin:0;text-transform:uppercase}
#sheet .meta{margin-top:18px;font-size:15px;line-height:1.7;color:#222}
#sheet .logo{height:96px;width:auto}
#sheet .to{margin:56px 0 28px;font-weight:700;font-size:16px;line-height:1.5}
#sheet .rule{border:0;border-top:2px solid #111;margin:0}
#sheet table.it{border-collapse:collapse;width:100%;margin:0;border:0}
#sheet .it th{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#222;border:0;background:none;padding:22px 10px 14px;font-weight:700}
#sheet .it td{border:0;padding:9px 10px;font-weight:300}
#sheet .note{text-align:center;font-weight:700;font-size:12.5px;letter-spacing:1.8px;margin:44px 0 18px;white-space:pre-line}
#sheet .bot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:16px 10px 36px}
#sheet .bank{margin-top:56px;line-height:1.8;font-weight:300}
#sheet .sum{width:340px;max-width:100%}
#sheet .sum div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
#sheet .sum .g{font-weight:700}
#sheet .rights{text-align:center;margin-top:28px;font-size:12px;letter-spacing:.5px;color:#444}
#sheet .ft{display:flex;justify-content:space-between;gap:24px;border-top:2px solid #111;padding:14px 10px 0;font-weight:300}
@media print{
 body{background:#fff}
 header,.noprint,#toast{display:none!important}
 main{max-width:none;margin:0;padding:0}
 #sheet{border:0;padding:12mm 14mm}
}
</style>
</head>
<body>
<header class="noprint"><b id="brand" style="cursor:pointer" onclick="go('home')">Nifti Tech</b>
<nav><button data-t="home">Home</button><button data-t="quotes">Quotes</button><button data-t="invoices">Invoices</button><button data-t="projects">Projects</button><button data-t="time">Time &amp; expenses</button><button data-t="clients">Clients</button><button data-t="reports">Reports</button><button data-t="settings">Settings</button></nav><span id="sync" class="noprint" style="margin-left:auto;font-size:13px"></span><button class="noprint" onclick="logout()" style="background:none;color:#b9c3cf;border-color:#4a5563;padding:3px 10px;font-size:13px">Log out</button></header>
<main id="app"></main>
<div id="toast"></div>

function load(){try{const d=JSON.parse(localStorage.getItem('nifti_db'));if(d&&d.settings)return {...DEF,...d,settings:{...DEF.settings,...d.settings}}}catch(e){}return JSON.parse(JSON.stringify(DEF))}

let rev=0,pw=localStorage.getItem('nifti_pw')||'',timer=null,saving=false,dirty=false;
function setSync(t,bad){const e=document.getElementById('sync');if(e){e.textContent=t;e.style.color=bad?'#f0a99c':'#9fd3a8'}}
function save(){try{localStorage.setItem('nifti_db',JSON.stringify(db));localStorage.setItem('nifti_dirty','1')}catch(e){toast('Could not save locally. Export a backup from Settings.')}
 dirty=true;setSync('Saving...');clearTimeout(timer);timer=setTimeout(push,500)}
const api=(m,body)=>fetch('/api/data',{method:m,headers:{'content-type':'application/json','x-app-password':pw,'x-base-rev':String(rev)},body});
async function push(){
 if(saving){timer=setTimeout(push,400);return}
 saving=true;dirty=false;
 try{const r=await api('PUT',JSON.stringify(db));
  if(r.status===401){showLogin('Session expired. Enter your password.');return}
  if(r.status===409){localStorage.setItem('nifti_db_conflict',JSON.stringify(db));await pull(true);render();toast('Another device changed the data. Latest version loaded.');return}
  if(!r.ok)throw 0;
  rev=(await r.json()).rev;localStorage.setItem('nifti_rev',rev);
  if(!dirty){localStorage.removeItem('nifti_dirty');setSync('Synced')}}
 catch(e){dirty=true;setSync('Offline, will retry',1);clearTimeout(timer);timer=setTimeout(push,10000)}
 finally{saving=false}}
async function pull(force){
 const r=await api('GET');
 if(r.status===401){const e=new Error('auth');e.auth=1;throw e}
 if(!r.ok)throw new Error('http');
 const j=await r.json();
 if(!j.data){rev=j.rev||0;save();return false}
 if(!force&&localStorage.getItem('nifti_dirty')==='1'&&j.rev===rev){save();return false}
 if(j.rev===rev&&!force)return false;
 try{localStorage.setItem('nifti_db_prev',localStorage.getItem('nifti_db')||'')}catch(e){}
 db={...DEF,...j.data,settings:{...DEF.settings,...j.data.settings}};
 rev=j.rev;
 try{localStorage.setItem('nifti_db',JSON.stringify(db));localStorage.setItem('nifti_rev',rev);localStorage.removeItem('nifti_dirty')}catch(e){}
 return true}
async function boot(){
 if(!pw){showLogin();return}
 rev=+localStorage.getItem('nifti_rev')||0;
 try{await pull();if(!dirty)setSync('Synced');render()}
 catch(e){if(e.auth){showLogin('Wrong or changed password.');return}setSync('Offline',1);render()}}

 o.innerHTML=`<div class="card" style="max-width:340px;margin:12vh auto"><h2>Sign in</h2><p class="mute">${msg||'Enter your password to open Nifti Tech Invoicing.'}</p><input type="password" id="lp" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"><div class="row" style="margin:12px 0 0"><button class="pri" onclick="doLogin()">Sign in</button></div></div>`;
 document.getElementById('lp').focus()}
async function doLogin(){pw=document.getElementById('lp').value;localStorage.setItem('nifti_pw',pw);const o=document.getElementById('login');if(o)o.remove();await boot()}
function logout(){if(localStorage.getItem('nifti_dirty')==='1'&&!confirm('Some changes have not synced yet and will be lost. Log out anyway?'))return;
 ['nifti_pw','nifti_db','nifti_rev','nifti_dirty'].forEach(k=>localStorage.removeItem(k));location.reload()}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&pw&&!dirty&&!saving&&V.sub!=='edit'){try{if(await pull())render()}catch(e){}}});
setInterval(async()=>{if(pw&&!dirty&&!saving&&V.sub!=='edit'&&document.visibilityState==='visible'){try{if(await pull())render()}catch(e){}}},60000);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const money=n=>db.settings.currency+' '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(i){const sub=i.items.reduce((a,l)=>a+(+l.q||0)*(+l.p||0),0);const disc=+i.discount||0;const taxable=Math.max(sub-disc,0);const tax=taxable*(+i.tax||0)/100;return{sub,disc,tax,total:taxable+tax}}
const isQ=i=>i.type==='quote';
const tabOf=i=>isQ(i)?'quotes':'invoices';
const payList=i=>i.payments&&i.payments.length?i.payments:(i.status==='paid'?[{date:i.paidOn||i.date,amount:calc(i).total,method:''}]:[]);
const paidAmt=i=>payList(i).reduce((a,p)=>a+(+p.amount||0),0);
const bal=i=>i.status==='paid'?0:Math.max(calc(i).total-paidAmt(i),0);
function status(i){if(isQ(i)||i.status==='draft')return i.status;if(bal(i)<=0.005)return 'paid';if(i.due<today())return 'overdue';return paidAmt(i)>0?'partial':'sent'}
const client=id=>db.clients.find(c=>c.id===id)||{name:'(deleted client)'};
const invById=id=>db.invoices.find(i=>i.id===id);

let V={tab:'home',sub:'list',id:null,filter:'all',q:''},ed=null;
function go(tab,sub='list',id=null){if(tab!==V.tab){V.filter='all';V.q=''}V={...V,tab,sub,id};render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab));

 const f={home:{list:homeView},quotes:{list:quoList,edit:invEdit,view:invView},invoices:{list:invList,edit:invEdit,view:invView},projects:{list:prjList,edit:prjEdit,view:prjView},time:{list:timeView},clients:{list:cliList,edit:cliEdit},reports:{list:repView},settings:{list:setView}}[V.tab][V.sub];
 $('#app').innerHTML=f();
 scrollTo(0,0);
 tickHome();

/* ---------- Clock and weather ---------- */
const WX={place:'Colombo',lat:6.9271,lon:79.8612,t:null,c:'',at:0};
const WXC=c=>c===0?'Clear':c<=3?'Partly cloudy':c<=48?'Fog':c<=57?'Drizzle':c<=67?'Rain':c<=77?'Snow':c<=82?'Showers':'Thunderstorm';
function tickHome(){
 const a=document.getElementById('hm-time');if(!a)return;
 const n=new Date();a.textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 document.getElementById('hm-date').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const tp=document.getElementById('hm-temp');
 if(WX.t!==null){tp.textContent=Math.round(WX.t)+'°C';document.getElementById('hm-wx').textContent=WX.place+(WX.c?' · '+WX.c:'')}
 if(Date.now()-WX.at>6e5){WX.at=Date.now();
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+WX.lat+'&longitude='+WX.lon+'&current=temperature_2m,weather_code&timezone=auto')
  .then(r=>r.json()).then(d=>{WX.t=d.current.temperature_2m;WX.c=WXC(d.current.weather_code);tickHome()})
  .catch(()=>{WX.at=Date.now()-5.4e5;if(WX.t===null)document.getElementById('hm-wx').textContent=WX.place+' · temperature unavailable'})}
}
setInterval(tickHome,1000);

/* ---------- Home ---------- */
function homeView(){
 const t=today(),m=t.slice(0,7),inv=db.invoices.filter(i=>!isQ(i)&&i.status!=='draft'),qs=db.invoices.filter(isQ);
 let billed=0,coll=0,out=0,over=0,overN=0,outN=0,paidN=0,billedM=0,collM=0;
 inv.forEach(i=>{const tt=calc(i).total,b=bal(i),st=status(i);billed+=tt;coll+=paidAmt(i);
  if(i.date.slice(0,7)===m)billedM+=tt;
  payList(i).forEach(x=>{if((x.date||'').slice(0,7)===m)collM+=+x.amount||0});
  if(b>0){out+=b;outN++}if(st==='overdue'){over+=b;overN++}if(st==='paid')paidN++});
 const qc=k=>qs.filter(i=>i.status===k).length,qv=qs.reduce((a,i)=>a+calc(i).total,0);
 const qDec=qc('approved')+qc('rejected'),win=qDec?Math.round(qc('approved')/qDec*100):0;
 const drafts=db.invoices.filter(i=>!isQ(i)&&i.status==='draft').length;
 const st=(l,v,k='',sub='')=>`<div class="stat ${k}"><small>${l}</small><strong>${v}</strong>${sub?`<small>${sub}</small>`:''}</div>`;
 const row=i=>`<tr class="click" onclick="go('${tabOf(i)}','view','${i.id}')"><td>${esc(i.no)}</td><td>${esc(client(i.clientId).name)}</td><td>${dmy(i.date)}</td><td><span class="tag ${status(i)}">${status(i)}</span></td><td class="n">${money(calc(i).total)}</td></tr>`;
 const rec=db.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no)).slice(0,6);
 const od=inv.filter(i=>status(i)==='overdue').sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);
 const tb=(h,rows,msg)=>rows.length?`<div class="wrap"><table><tr>${h.map((x,k)=>`<th${k>3?' class="n"':''}>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${msg}</div>`;
 const act=(db.projects||[]).filter(p=>p.status==='active').length;
 return `<div class="row"><h2 class="grow" style="margin:0">Welcome to ${esc(db.settings.name)}</h2>
  <button class="pri" onclick="newInv()">New invoice</button><button onclick="newInv(true)">New quote</button></div>
 <div class="card clk"><div><div class="tm" id="hm-time"></div><small id="hm-date"></small></div>
  <div><div class="tp" id="hm-temp">--</div><small id="hm-wx">${esc(WX.place)}</small></div></div>
 <div class="stats">
  ${st('Total invoiced',money(billed),'',inv.length+' invoices sent')}
  ${st('Total collected',money(coll),'',paidN+' fully paid')}
  ${st('Outstanding',money(out),'',outN+' unpaid')}
  ${st('Overdue',money(over),'big',overN+' overdue')}</div>
 <div class="stats">
  ${st('Invoiced this month',money(billedM))}
  ${st('Collected this month',money(collM))}
  ${st('Draft invoices',drafts)}
  ${st('Active projects',act)}</div>
 <div class="stats">
  ${st('Quotes',qs.length,'',money(qv)+' total value')}
  ${st('Quotes awaiting reply',qc('sent'))}
  ${st('Quotes approved',qc('approved'))}
  ${st('Quote win rate',qDec?win+'%':'-','',qc('rejected')+' rejected')}</div>
 <h2 style="font-size:17px;margin-top:24px">Overdue invoices</h2>${tb(['Number','Client','Date','Status','Total'],od.map(row),'Nothing overdue. Nice work.')}
 <h2 style="font-size:17px;margin-top:24px">Recent invoices and quotes</h2>${tb(['Number','Client','Date','Status','Total'],rec.map(row),'No invoices or quotes yet.')}`;
}

function invList(){
 const t=today(),m=t.slice(0,7);
 let out=0,over=0,paidM=0,cntM=0;
 db.invoices.filter(i=>!isQ(i)).forEach(i=>{const s=status(i);
  if(['sent','partial','overdue'].includes(s))out+=bal(i);if(s==='overdue')over+=bal(i);
  payList(i).forEach(p=>{if((p.date||'').slice(0,7)===m)paidM+=+p.amount||0});
  if(i.date.slice(0,7)===m)cntM++});
 const q=V.q.toLowerCase();
 const rows=db.invoices.filter(i=>isQ(i)===(V.tab==='quotes')&&(V.filter==='all'||status(i)===V.filter)&&(!q||(i.no+client(i.clientId).name).toLowerCase().includes(q)))
  .sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no));
 return `<div class="row"><h2 class="grow" style="margin:0">Invoices</h2><button class="pri" onclick="newInv()">New invoice</button></div>
 <div class="stats">
  <div class="stat"><small>Outstanding</small><strong>${money(out)}</strong></div>
  <div class="stat big"><small>Overdue</small><strong>${money(over)}</strong></div>
  <div class="stat"><small>Collected this month</small><strong>${money(paidM)}</strong></div>
  <div class="stat"><small>Invoices this month</small><strong>${cntM}</strong></div></div>
 <div class="row"><input style="max-width:280px" placeholder="Search by number or client" value="${esc(V.q)}" oninput="V.q=this.value;keepList()">
 <select style="max-width:160px" onchange="V.filter=this.value;render()">${['all','draft','sent','partial','overdue','paid'].map(s=>`<option value="${s}" ${V.filter===s?'selected':''}>${s==='all'?'All statuses':s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
 <div id="tbl">${tbl(rows)}</div>`;

function tbl(rows){
 if(!rows.length)return `<div class="empty">No ${V.tab==='quotes'?'quotes':'invoices'} to show. Select “New ${V.tab==='quotes'?'quote':'invoice'}” to start.</div>`;
 return `<div class="wrap"><table><tr><th>Number</th><th>Client</th><th>Date</th><th>${V.tab==='quotes'?'Valid until':'Due'}</th><th>Status</th><th class="n">Total</th></tr>${rows.map(i=>{const s=status(i);return `<tr class="click" onclick="go('${tabOf(i)}','view','${i.id}')"><td>${esc(i.no)}</td><td>${esc(client(i.clientId).name)}</td><td>${i.date}</td><td>${i.due}</td><td><span class="tag ${s}">${s}</span></td><td class="n">${money(calc(i).total)}</td></tr>`}).join('')}</table></div>`}
function keepList(){const q=V.q.toLowerCase();$('#tbl').innerHTML=tbl(db.invoices.filter(i=>isQ(i)===(V.tab==='quotes')&&(V.filter==='all'||status(i)===V.filter)&&(!q||(i.no+client(i.clientId).name).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no)))}

function nextNo(q){const s=db.settings;return q?s.qprefix+String(s.qnext).padStart(3,'0'):s.prefix+String(s.next).padStart(3,'0')}
function newInv(q){q=!!q;
 if(!db.clients.length){toast('Add a client first.');go('clients','edit','new');return}
 const s=db.settings;
 ed={id:null,type:q?'quote':'invoice',projectId:'',payments:[],no:nextNo(q),clientId:db.clients[0].id,date:today(),due:addDays(today(),+s.dueDays||14),items:[{d:'',q:1,p:0}],tax:+s.taxRate||0,discount:0,status:'draft',notes:s.terms,showBank:true,showNote:true,bank:s.bank};
 V={...V,tab:q?'quotes':'invoices',sub:'edit',id:null};render()}

function totals(){
 ed.items.forEach((l,k)=>{const el=$('#amt'+k);if(el)el.textContent=money((+l.q||0)*(+l.p||0))});
 const c=calc(ed);$('#t-sub').textContent=money(c.sub);$('#t-tax').textContent=money(c.tax);$('#t-tot').textContent=money(c.total)}
function saveInv(){
 const e=ed;
 if(!e.no.trim())return toast('Enter an invoice number.');
 if(db.invoices.some(i=>i.no===e.no&&i.id!==e.id))return toast('That invoice number already exists.');
 if(!e.items.some(l=>l.d.trim()||+l.p))return toast('Add at least one line item.');
 if(e.due<e.date)return toast('Due date is before the invoice date.');
 e.items=e.items.filter(l=>l.d.trim()||+l.p);
 if(e.id){db.invoices[db.invoices.findIndex(i=>i.id===e.id)]=e}
 else{e.id=uid();db.invoices.push(e);
  const s=db.settings,q=isQ(e),pf=q?s.qprefix:s.prefix,k=q?'qnext':'next';
  const m=e.no.startsWith(pf)&&parseInt(e.no.slice(pf.length),10);
  if(m&&m>=s[k])s[k]=m+1}
 save();toast((isQ(e)?'Quote':'Invoice')+' saved.');go(tabOf(e),'view',e.id)}

function addPay(id){const i=invById(id),a=+$('#pa').value;if(!(a>0))return toast('Enter an amount above zero.');
 const d=$('#pd').value||today();i.payments=i.payments||[];i.payments.push({date:d,amount:a,method:$('#pm').value});
 if(calc(i).total-paidAmt(i)<=0.005){i.status='paid';i.paidOn=d}save();toast('Payment recorded.');render()}
function delPay(id,k){const i=invById(id);i.payments.splice(k,1);if(i.status==='paid'&&calc(i).total-paidAmt(i)>0.005)i.status='sent';save();render()}
function dupInv(id){const i=JSON.parse(JSON.stringify(invById(id))),q=isQ(i);i.id=null;i.no=nextNo(q);i.date=today();i.due=addDays(today(),q?30:(+db.settings.dueDays||14));i.status='draft';i.paidOn=null;i.payments=[];ed=i;go(tabOf(i),'edit',null);toast('Copied as a new draft.')}
function toInv(id){const i=JSON.parse(JSON.stringify(invById(id)));i.fromQuote=i.no;i.id=null;i.type='invoice';i.no=nextNo();i.date=today();i.due=addDays(today(),+db.settings.dueDays||14);i.status='draft';i.payments=[];ed=i;go('invoices','edit',null);toast('Review the invoice, then save.')}
function delInv(id){const i=invById(id);if(confirm('Delete '+i.no+'? This cannot be undone.')){
 db.time.concat(db.expenses).forEach(x=>{if(x.invId===id)x.invId=null});db.projects.forEach(p=>(p.ms||[]).forEach(m=>{if(m.invId===id)m.invId=null}));
 db.invoices=db.invoices.filter(x=>x.id!==id);save();toast('Deleted.');go(V.tab,'list')}}

/* ---------- Settings ---------- */
function setView(){
 const s=db.settings,f=(k,l,t='text')=>`<div><label>${l}</label><input type="${t}" id="s-${k}" value="${esc(s[k])}"></div>`;
 return `<h2>Settings</h2><div class="card"><div class="grid">${f('name','Business name')}${f('email','Email')}${f('phone','Phone')}${f('taxId','Tax or registration number')}
 ${f('currency','Currency label (e.g. LKR, USD)')}${f('taxRate','Default tax %','number')}${f('dueDays','Default days until due','number')}${f('prefix','Invoice number prefix')}${f('next','Next invoice number','number')}${f('website','Website')}${f('handle','Social handle')}${f('qprefix','Quote number prefix')}${f('qnext','Next quote number','number')}</div>
 <div style="margin-top:12px"><label>Business address</label><textarea id="s-address" rows="3">${esc(s.address)}</textarea></div>
 <div style="margin-top:12px"><label>Default bank details (copied to each new invoice)</label><textarea id="s-bank" rows="3">${esc(s.bank)}</textarea></div>
 <div style="margin-top:12px"><label>Default note (copied to each new invoice or quote)</label><textarea id="s-terms" rows="2">${esc(s.terms)}</textarea></div>
 <div class="row" style="margin-top:12px"><button class="pri" onclick="saveSet()">Save settings</button></div></div>
 <div class="card"><b>Backup and export</b><p class="mute" style="margin:4px 0 12px">Your data syncs to the cloud and is shared across all devices you sign in on. The server also keeps 10 rolling backups. Still export a copy now and then and keep it somewhere safe.</p>
 <div class="row"><button onclick="backup()">Download backup</button><button onclick="$('#imp').click()">Restore from backup</button><button onclick="csv()">Export invoices (CSV)</button><input type="file" id="imp" accept=".json" hidden onchange="restore(this.files[0])"></div></div>`}
function saveSet(){
 const s=db.settings;
 ['name','email','phone','taxId','currency','prefix','qprefix','website','handle','address','bank','terms'].forEach(k=>s[k]=$('#s-'+k).value);
 ['taxRate','dueDays','next','qnext'].forEach(k=>s[k]=Math.max(0,+$('#s-'+k).value||0));
 s.next=Math.max(1,s.next);s.qnext=Math.max(1,s.qnext);save();toast('Settings saved.');render()}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){dl('nifti-backup-'+today()+'.json',JSON.stringify(db,null,1),'application/json')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.invoices)||!Array.isArray(d.clients))throw 0;if(!confirm('This replaces all current data with the backup. Continue?'))return;db={...DEF,...d};save();toast('Backup restored.');go('invoices')}catch(e){toast('That file is not a valid backup.')}};r.readAsText(f)}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=[['Number','Client','Date','Due','Status','Subtotal','Discount','Tax','Total','Paid on'].map(q).join(',')];
 db.invoices.filter(i=>!isQ(i)).forEach(i=>{const t=calc(i);rows.push([i.no,client(i.clientId).name,i.date,i.due,status(i),t.sub.toFixed(2),t.disc.toFixed(2),t.tax.toFixed(2),t.total.toFixed(2),i.paidOn||''].map(q).join(','))});
 dl('invoices-'+today()+'.csv','\ufeff'+rows.join('\n'),'text/csv')}

const T=(h,r,L=1)=>`<div class="wrap"><table><tr>${h.map((x,k)=>`<th${k>=L?' class="n"':''}>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map((c,k)=>`<td${k>=L?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="mute">No data yet.</td></tr>`}</table></div>`;
const link=(tab,id,txt)=>`<a href="#" onclick="go('${tab}','view','${id}');return false">${esc(txt)}</a>`;

/* ---------- Projects ---------- */
const prj=id=>db.projects.find(p=>p.id===id);
function pStats(p){
 const iv=db.invoices.filter(i=>!isQ(i)&&i.projectId===p.id),tm=db.time.filter(x=>x.projectId===p.id),ex=db.expenses.filter(x=>x.projectId===p.id);
 const inv=iv.filter(i=>i.status!=='draft').reduce((a,i)=>a+calc(i).total,0),lab=tm.reduce((a,x)=>a+(+x.hours||0)*(+x.cost||0),0),exp=ex.reduce((a,x)=>a+(+x.amount||0),0);
 return{inv,lab,exp,col:iv.reduce((a,i)=>a+paidAmt(i),0),hrs:tm.reduce((a,x)=>a+(+x.hours||0),0),profit:inv-lab-exp}}
const unb=pid=>({t:db.time.filter(x=>x.projectId===pid&&!x.invId),e:db.expenses.filter(x=>x.projectId===pid&&x.billable&&!x.invId)});
function prjList(){
 return `<div class="row"><h2 class="grow" style="margin:0">Projects</h2><button class="pri" onclick="go('projects','edit','new')">New project</button></div>
 ${db.projects.length?T(['Project','Client','Status','Budget','Invoiced','Costs','Profit'],db.projects.map(p=>{const s=pStats(p);return [link('projects',p.id,p.name),esc(client(p.clientId).name),`<span class="tag ${p.status}">${p.status}</span>`,money(p.budget),money(s.inv),money(s.lab+s.exp),money(s.profit)]}),3):'<div class="empty">No projects yet. Create one to group quotes, invoices, hours, and expenses.</div>'}`}
function prjEdit(){
 if(!db.clients.length)return '<div class="empty">Add a client first.</div>';
 const p=V.id==='new'?{name:'',clientId:db.clients[0].id,budget:0,status:'active'}:prj(V.id),o=(v,l)=>`<option value="${v}" ${p.status===v?'selected':''}>${l}</option>`;
 return `<h2>${V.id==='new'?'New project':'Edit project'}</h2><div class="card"><div class="grid"><div><label>Project name</label><input id="p-name" value="${esc(p.name)}"></div>
 <div><label>Client</label><select id="p-cl">${db.clients.map(c=>`<option value="${c.id}" ${c.id===p.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div><label>Budget</label><input type="number" min="0" step="any" id="p-bud" value="${p.budget}"></div>
 <div><label>Status</label><select id="p-st">${o('active','Active')}${o('done','Done')}</select></div></div></div>
 <div class="row"><button class="pri" onclick="savePrj()">Save project</button><button onclick="go('projects',${V.id==='new'?"'list'":`'view','${V.id}'`})">Cancel</button><span class="grow"></span>${V.id!=='new'?'<button class="dng" onclick="delPrj()">Delete project</button>':''}</div>`}
function savePrj(){const n=$('#p-name').value.trim();if(!n)return toast('Enter a project name.');
 const d={name:n,clientId:$('#p-cl').value,budget:+$('#p-bud').value||0,status:$('#p-st').value};let id=V.id;
 if(id==='new'){id=uid();db.projects.push({id,ms:[],...d})}else Object.assign(prj(id),d);save();toast('Project saved.');go('projects','view',id)}
function delPrj(){const id=V.id;if(db.invoices.some(i=>i.projectId===id)||db.time.some(x=>x.projectId===id)||db.expenses.some(x=>x.projectId===id))return toast('This project has linked records. Mark it as done instead.');
 if(confirm('Delete this project?')){db.projects=db.projects.filter(p=>p.id!==id);save();go('projects')}}
function prjView(){
 const p=prj(V.id);if(!p)return '<div class="empty">Project not found.</div>';
 const s=pStats(p),u=unb(p.id),ub=u.t.reduce((a,x)=>a+(+x.hours||0)*(+x.rate||0),0)+u.e.reduce((a,x)=>a+(+x.amount||0),0),ms=p.ms||[];
 const st=(l,v)=>`<div class="stat"><small>${l}</small><strong>${v}</strong></div>`;
 const docs=db.invoices.filter(i=>i.projectId===p.id).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="row"><button onclick="go('projects')">Back</button><h2 class="grow" style="margin:0">${esc(p.name)} <span class="tag ${p.status}">${p.status}</span></h2><button onclick="go('projects','edit','${p.id}')">Edit</button><button onclick="prjDoc('${p.id}',true)">New quote</button><button class="pri" onclick="prjDoc('${p.id}',false)">New invoice</button></div>
 <p class="mute">Client: ${esc(client(p.clientId).name)}</p>
 <div class="stats">${st('Budget',money(p.budget))}${st('Invoiced',money(s.inv))}${st('Collected',money(s.col))}${st('Costs',money(s.lab+s.exp))}${st('Profit',money(s.profit))}${st('Hours logged',s.hrs)}</div>
 <div class="card"><b>Milestones</b>
 ${ms.length?T(['Milestone','Amount','Invoice',''],ms.map((m,k)=>{const iv=m.invId&&invById(m.invId);return [esc(m.name),money(m.amount),iv?`${link('invoices',iv.id,iv.no)} <span class="tag ${status(iv)}">${status(iv)}</span>`:'Not invoiced',iv?'':`<button onclick="msInv('${p.id}',${k})">Create invoice</button> <button class="dng" title="Remove" onclick="delMs('${p.id}',${k})">×</button>`]})):'<p class="mute">No milestones yet.</p>'}
 <div class="inl" style="margin-top:12px"><div style="flex:3"><label>Milestone name</label><input id="mn"></div><div><label>Amount</label><input type="number" min="0" step="any" id="ma"></div><button onclick="addMs('${p.id}')">Add milestone</button></div></div>
 <div class="card"><b>Unbilled work</b><p class="mute">${u.t.length} time entries and ${u.e.length} billable expenses, ${money(ub)} in total.</p><button ${u.t.length||u.e.length?'':'disabled'} onclick="billWork('${p.id}')">Create invoice from unbilled work</button></div>
 <h2 style="font-size:17px">Quotes and invoices</h2>${docs.length?T(['Number','Type','Date','Status','Total'],docs.map(i=>[link(tabOf(i),i.id,i.no),isQ(i)?'Quote':'Invoice',i.date,`<span class="tag ${status(i)}">${status(i)}</span>`,money(calc(i).total)]),4):'<div class="empty">Nothing linked to this project yet.</div>'}`}
function prjDoc(pid,q){newInv(q);ed.projectId=pid;ed.clientId=prj(pid).clientId;render()}
function addMs(pid){const p=prj(pid),n=$('#mn').value.trim(),a=+$('#ma').value;if(!n||!(a>0))return toast('Enter a milestone name and an amount.');(p.ms=p.ms||[]).push({id:uid(),name:n,amount:a,invId:null});save();render()}
function delMs(pid,k){prj(pid).ms.splice(k,1);save();render()}
function mkDraft(p,items,after){const s=db.settings,i={id:uid(),type:'invoice',projectId:p.id,no:nextNo(),clientId:p.clientId,date:today(),due:addDays(today(),+s.dueDays||14),items,tax:+s.taxRate||0,discount:0,status:'draft',notes:s.terms,payments:[],showBank:true,showNote:true,bank:s.bank};
 db.invoices.push(i);s.next++;after(i);save();toast('Draft invoice created.');go('invoices','view',i.id)}
function msInv(pid,k){const p=prj(pid),m=p.ms[k];mkDraft(p,[{d:p.name+' - '+m.name,q:1,p:m.amount}],i=>{m.invId=i.id})}
function billWork(pid){const p=prj(pid),u=unb(pid);
 const items=u.t.map(x=>({d:`${x.who||'Engineer'}: ${x.desc||'Work'} (${x.date})`,q:+x.hours,p:+x.rate})).concat(u.e.map(x=>({d:`Expense: ${x.desc} (${x.date})`,q:1,p:+x.amount})));
 mkDraft(p,items,i=>u.t.concat(u.e).forEach(x=>{x.invId=i.id}))}

/* ---------- Time and expenses ---------- */
function timeView(){
 if(!db.projects.length)return '<h2>Time and expenses</h2><div class="empty">Create a project first, then log hours and expenses against it.</div>';
 const po=db.projects.filter(p=>p.status==='active').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 const srt=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date)),pn=x=>prj(x.projectId)?esc(prj(x.projectId).name):'(deleted)';
 const st=x=>x.invId&&invById(x.invId)?esc(invById(x.invId).no):'Unbilled',del=(f,x)=>x.invId?'':`<button class="dng" title="Delete" onclick="${f}('${x.id}')">×</button>`;
 const un=db.projects.reduce((a,p)=>{const u=unb(p.id);return a+u.t.reduce((x,y)=>x+(+y.hours||0)*(+y.rate||0),0)+u.e.reduce((x,y)=>x+(+y.amount||0),0)},0);
 return `<h2>Time and expenses</h2><div class="stats"><div class="stat"><small>Unbilled work</small><strong>${money(un)}</strong></div></div>
 <div class="card"><b>Log time</b><div class="inl" style="margin-top:8px"><div><label>Project</label><select id="t-p">${po}</select></div><div><label>Engineer</label><input id="t-w"></div><div><label>Date</label><input type="date" id="t-d" value="${today()}"></div><div><label>Hours</label><input type="number" min="0" step="any" id="t-h"></div><div><label>Billing rate per hour</label><input type="number" min="0" step="any" id="t-r"></div><div><label>Cost rate per hour (optional)</label><input type="number" min="0" step="any" id="t-c"></div><div style="flex:3"><label>Description</label><input id="t-x"></div><button class="pri" onclick="addTime()">Add time</button></div></div>
 ${T(['Date','Project','Engineer','Status','Hours','Amount',''],srt(db.time).slice(0,100).map(x=>[x.date,pn(x),esc(x.who),st(x),+x.hours,money(x.hours*x.rate),del('delTime',x)]),4)}
 <div class="card" style="margin-top:20px"><b>Log expense</b><div class="inl" style="margin-top:8px"><div><label>Project</label><select id="e-p">${po}</select></div><div><label>Date</label><input type="date" id="e-d" value="${today()}"></div><div style="flex:3"><label>Description</label><input id="e-x"></div><div><label>Amount</label><input type="number" min="0" step="any" id="e-a"></div><div style="flex:0;min-width:110px"><label>Bill to client</label><input type="checkbox" id="e-b" checked style="width:auto"></div><button class="pri" onclick="addExp()">Add expense</button></div></div>
 ${T(['Date','Project','Description','Status','Billable','Amount',''],srt(db.expenses).slice(0,100).map(x=>[x.date,pn(x),esc(x.desc),st(x),x.billable?'Yes':'No',money(x.amount),del('delExp',x)]),4)}`}
function addTime(){const p=$('#t-p').value,h=+$('#t-h').value;if(!p)return toast('Choose a project.');if(!(h>0))return toast('Enter the hours worked.');
 db.time.push({id:uid(),projectId:p,who:$('#t-w').value.trim(),date:$('#t-d').value||today(),hours:h,rate:+$('#t-r').value||0,cost:+$('#t-c').value||0,desc:$('#t-x').value.trim(),invId:null});save();toast('Time added.');render()}
function addExp(){const p=$('#e-p').value,a=+$('#e-a').value;if(!p)return toast('Choose a project.');if(!(a>0)||!$('#e-x').value.trim())return toast('Enter a description and an amount.');

function delTime(id){db.time=db.time.filter(x=>x.id!==id);save();render()}
function delExp(id){db.expenses=db.expenses.filter(x=>x.id!==id);save();render()}

/* ---------- Reports ---------- */
function repView(){
 const inv=db.invoices.filter(i=>!isQ(i)&&i.status!=='draft'),mo={},cl={},ag=[0,0,0,0,0];
 const M=k=>mo[k]=mo[k]||{i:0,c:0};
 inv.forEach(i=>{const n=client(i.clientId).name,t=calc(i).total;M(i.date.slice(0,7)).i+=t;const c=cl[n]=cl[n]||{i:0,c:0,b:0};c.i+=t;c.b+=bal(i);
  payList(i).forEach(p=>{M((p.date||i.date).slice(0,7)).c+=+p.amount||0;c.c+=+p.amount||0});
  if(bal(i)>0){const d=Math.floor((new Date(today())-new Date(i.due))/864e5);ag[d<=0?0:d<=30?1:d<=60?2:d<=90?3:4]+=bal(i)}});
 const keys=Object.keys(mo).sort().reverse().slice(0,12),mx=Math.max(1,...keys.map(k=>mo[k].i));
 const qs=db.invoices.filter(isQ),qn=k=>qs.filter(i=>i.status===k),w=qn('approved').length,l=qn('rejected').length;
 return `<h2>Reports</h2>
 <h2 style="font-size:17px">Revenue by month</h2>${T(['Month','Invoiced','Collected',''],keys.map(k=>[k,money(mo[k].i),money(mo[k].c),`<div style="width:140px;margin-left:auto"><div class="bar" style="width:${mo[k].i/mx*100}%"></div></div>`]))}
 <h2 style="font-size:17px;margin-top:24px">Unpaid invoices by age</h2>${T(['Not yet due','1 to 30 days late','31 to 60 days late','61 to 90 days late','Over 90 days late'],[ag.map(money)],0)}
 <h2 style="font-size:17px;margin-top:24px">Revenue by client</h2>${T(['Client','Invoiced','Collected','Outstanding'],Object.entries(cl).sort((a,b)=>b[1].i-a[1].i).map(([n,v])=>[esc(n),money(v.i),money(v.c),money(v.b)]))}
 <h2 style="font-size:17px;margin-top:24px">Profit by project</h2>${T(['Project','Invoiced','Costs','Profit'],db.projects.map(p=>{const s=pStats(p);return [esc(p.name),money(s.inv),money(s.lab+s.exp),money(s.profit)]}))}
 <p class="mute">Profit is invoiced amount (excluding drafts) minus expenses and labour cost (hours times cost rate).</p>
 <h2 style="font-size:17px;margin-top:24px">Quotes</h2>${T(['Status','Quotes','Value'],['draft','sent','approved','rejected'].map(k=>[k,qn(k).length,money(qn(k).reduce((a,i)=>a+calc(i).total,0))]))}
 <p class="mute">${w+l?`Approval rate: ${Math.round(w/(w+l)*100)}% of decided quotes.`:'No decided quotes yet.'}</p>`}

boot();
</script>
